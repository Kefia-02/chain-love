name: Research Lychee SSRF (safe loopback only)

on:
  push:
    branches:
      - research/lychee-safe-ssrf-validation-20261116
    paths:
      - .github/tests/lychee_ssrf_safe_probe_20261116.py
      - .github/workflows/research-lychee-ssrf-safe.yaml

permissions:
  contents: read

jobs:
  local-only-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install exact Lychee v0.24.2 binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lychee-safe"
          curl -fsSL --retry 2 --max-time 60 \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            -o "$RUNNER_TEMP/lychee-safe/lychee.tar.gz"
          tar -xzf "$RUNNER_TEMP/lychee-safe/lychee.tar.gz" -C "$RUNNER_TEMP/lychee-safe"
          LYCHEE_BIN="$(find "$RUNNER_TEMP/lychee-safe" -type f -name lychee -print -quit)"
          test -n "$LYCHEE_BIN"
          mkdir -p "$RUNNER_TEMP/lychee-bin"
          install -m 0755 "$LYCHEE_BIN" "$RUNNER_TEMP/lychee-bin/lychee"
          echo "$RUNNER_TEMP/lychee-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/lychee-bin/lychee" --version
      - name: Run only disposable loopback servers and verify header absence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo '127.0.0.1 lychee-alias.test lychee-redirect.test' | sudo tee -a /etc/hosts > /dev/null
          python3 .github/tests/lychee_ssrf_safe_probe_20261116.py
