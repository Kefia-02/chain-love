name: Submit verified data PR to Chain.Love

# Runs after Codex pushes a data/* branch to this fork.
# Does not merge PRs, send funds, or run untrusted branch code.
on:
  push:
    branches:
      - 'data/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Existing branch to submit, e.g. data/fix-somnia-links'
        required: true
        type: string

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.CHAIN_LOVE_PR_TOKEN }}
      BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
      FORK: Kefia-02/chain-love
      UPSTREAM: Chain-Love/chain-love
    steps:
      - name: Create upstream PR if absent
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Create repository secret CHAIN_LOVE_PR_TOKEN with a GitHub user token."
            exit 1
          fi
          if [[ ! "$BRANCH" =~ ^data/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Only branches under data/ can be submitted."
            exit 1
          fi

          # Don't create a second PR, including when the original was closed.
          existing="$(gh pr list --repo "$UPSTREAM" --head "Kefia-02:$BRANCH" --state all --limit 100 --json number,url --jq '.[0].url // ""')"
          if [[ -n "$existing" ]]; then
            echo "PR already exists: $existing"
            exit 0
          fi

          sha="$(gh api --method GET "/repos/$FORK/commits" -f "sha=$BRANCH" -f "per_page=1" --jq '.[0].sha')"
          if [[ -z "$sha" || "$sha" == "null" ]]; then
            echo "::error::Unable to find branch commit."
            exit 1
          fi
          subject="$(gh api "/repos/$FORK/commits/$sha" --jq '.commit.message | split("\n")[0]')"
          message="$(gh api "/repos/$FORK/commits/$sha" --jq '.commit.message')"

          # The submitted content is a proposal only. Never state that
          # contributor personally checked links when that hasn't happened.
          body="$(cat <<EOF
          ## Summary
          Proposed data correction from \`$FORK\` branch \`$BRANCH\`.

          ### Commit details
          \`\`\`
          $message
          \`\`\`

          ### Verification
          - [ ] Check the actual diff and source URLs against the Chain.Love style guide.
          - [ ] Personally confirm any newly added links / network support before affirming the contribution checklist.
          - [ ] Confirm validations have passed; this workflow does not perform CSV tests.

          ## Rewards
          Ethereum Mainnet payout address: \`0x849B41846DdbF527C385C25820F7240Bba166DFf\`

          _PR opened automatically by GitHub Actions. No reward is guaranteed._
          EOF
          )"
          gh pr create --repo "$UPSTREAM" --base main --head "Kefia-02:$BRANCH" --title "$subject" --body "$body"
